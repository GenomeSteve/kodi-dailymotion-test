name: Publish isolated Dailymotion test feed
on:
  push:
    paths:
      - build_repo.py
      - playback_patch.py.txt
      - .github/workflows/publish.yml
  workflow_dispatch:
concurrency:
  group: dailymotion-build
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build Kodi repository from pinned upstream ZIP
        run: python build_repo.py
      - name: Publish generated files safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python build_repo.py
            git add addons.xml addons.xml.md5 index.html repository.genomesteve.dailymotion.test-1.0.0.zip plugin.video.dailymotion_com/ repository.genomesteve.dailymotion.test/
            if git diff --cached --quiet; then
              echo "Already published"
              exit 0
            fi
            git commit -m "Publish isolated Dailymotion 2.4.5.3 test build"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent push; rebuilding against latest main"
          done
          exit 1
